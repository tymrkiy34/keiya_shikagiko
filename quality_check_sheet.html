<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>品質チェックシート</title>
<style>
  @page { size: 257mm 182mm; margin: 10mm; }
  :root { --ink:#1f2d3a; --accent:#2a7f8e; --line:#b9c6cc; --soft:#eef5f7; }
  * { box-sizing: border-box; }
  body { margin:0; background:#e9eef0; color:var(--ink);
    font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif; font-size:11pt; line-height:1.4; }
  .sheet { width:257mm; height:182mm; margin:10mm auto; padding:10mm; background:#fff; }
  @media print { body{background:#fff} .sheet{margin:0; padding:0; width:auto; height:auto} }

  header { display:flex; justify-content:space-between; align-items:flex-end;
    border-bottom:3px solid var(--accent); padding-bottom:5px; margin-bottom:10px; }
  h1 { margin:0; font-size:22pt; letter-spacing:.15em; color:var(--accent); }
  header p { margin:0; font-size:9.5pt; }

  .cols { display:grid; grid-template-columns:1.1fr 1fr; gap:10mm; }
  h2 { font-size:11.5pt; margin:0 0 5px; padding-left:8px; border-left:4px solid var(--accent); }
  .block + .block { margin-top:12px; }

  table { width:100%; border-collapse:collapse; }
  th, td { border:1px solid var(--line); padding:4px 8px; vertical-align:middle; }
  th { background:var(--soft); font-weight:600; text-align:left; width:30%; }
  .fill { height:9mm; }
  .check thead th { text-align:center; width:17mm; font-size:10pt; }
  .check thead th:first-child { width:auto; text-align:left; }
  .check td { height:9.5mm; }
  .c { text-align:center; }
  .box { display:inline-block; width:5mm; height:5mm; border:1.4px solid var(--ink); border-radius:1px; vertical-align:middle; }

  .rating { display:flex; justify-content:space-between; align-items:center; font-size:9.5pt; }
  .s { display:flex; flex-direction:column; align-items:center; gap:2px; }
  .s b { font-size:13pt; }
  .memo { height:62mm; border:1px solid var(--line); padding:6px 8px; font-size:9.5pt; color:#7b8a93; }
  footer { margin-top:8px; font-size:9.5pt; text-align:center; color:#5a6b75; }
</style>
</head>
<body>
<div class="sheet">
  <header>
    <div>
      <h1>品質チェックシート</h1>
      <p>歯科技工物のご使用後、該当箇所に ✔ をお願いします。</p>
    </div>
    <p>Quality Check Sheet</p>
  </header>

  <div class="cols">
    <div>
      <div class="block">
        <h2>症例情報</h2>
        <table>
          <tr><th>歯科医院名</th><td class="fill"></td></tr>
          <tr><th>患者名 / ID</th><td class="fill"></td></tr>
          <tr><th>納品日</th><td class="fill">　　　年　　月　　日</td></tr>
        </table>
      </div>
      <div class="block">
        <h2>チェック項目</h2>
        <table class="check">
          <thead><tr><th>項目</th><th>良好</th><th>調整<br>必要</th><th>不良</th></tr></thead>
          <tbody>
      <tr><td>適合（支台歯・辺縁）</td><td class="c"><span class="box"></span></td><td class="c"><span class="box"></span></td><td class="c"><span class="box"></span></td></tr>
      <tr><td>隣接面コンタクト</td><td class="c"><span class="box"></span></td><td class="c"><span class="box"></span></td><td class="c"><span class="box"></span></td></tr>
      <tr><td>咬合（接触・高さ）</td><td class="c"><span class="box"></span></td><td class="c"><span class="box"></span></td><td class="c"><span class="box"></span></td></tr>
      <tr><td>形態・豊隆</td><td class="c"><span class="box"></span></td><td class="c"><span class="box"></span></td><td class="c"><span class="box"></span></td></tr>
      <tr><td>色調（シェード）</td><td class="c"><span class="box"></span></td><td class="c"><span class="box"></span></td><td class="c"><span class="box"></span></td></tr>
      <tr><td>表面性状・研磨</td><td class="c"><span class="box"></span></td><td class="c"><span class="box"></span></td><td class="c"><span class="box"></span></td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <div>
      <div class="block">
        <h2>総合評価</h2>
        <div class="rating">
          <span>満足</span>
      <div class="s"><span class="box"></span><b>5</b></div>
      <div class="s"><span class="box"></span><b>4</b></div>
      <div class="s"><span class="box"></span><b>3</b></div>
      <div class="s"><span class="box"></span><b>2</b></div>
      <div class="s"><span class="box"></span><b>1</b></div>
          <span>不満</span>
        </div>
      </div>
      <div class="block">
        <h2>ご意見・ご要望</h2>
        <div class="memo">気になった点を自由にご記入ください</div>
      </div>
    </div>
  </div>

  <footer>ご協力ありがとうございました。</footer>
</div>
</body>
</html>
